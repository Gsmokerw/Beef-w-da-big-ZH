name: Build Multiplatform (Windows, Linux, macOS)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: shadow_dimension-windows.exe
            binary_path: build/Release/shadow_dimension.exe
          - os: ubuntu-latest
            artifact_name: shadow_dimension-linux
            binary_path: build/shadow_dimension
          - os: macos-latest
            artifact_name: shadow_dimension-macos
            binary_path: build/shadow_dimension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/shadow_dimension
            build/Release/shadow_dimension.exe
            build/shadow_dimension.exe
          if-no-files-found: warn
